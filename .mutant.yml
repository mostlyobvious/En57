usage: opensource
includes:
- lib
- test
requires:
- sequel
- active_record
- connection_pool
- en57
- en57/benchmark
integration:
  name: minitest
matcher:
  subjects:
    - En57*
  ignore:
    - En57::EventStore.for_active_record
    - En57::EventStore.for_pg
    - En57::EventStore.for_pooled_pg
    - En57::EventStore.for_sequel
    - En57::JsonSerializer#optional_big_decimal_type
    - En57::Migrator*
    - En57::Repository#initialize
    - En57::ActiveRecordAdapter#with_transaction
    - En57::SequelAdapter#with_transaction
    - En57::Benchmark::AppendNoFailIf*
    - En57::Benchmark::AppendNonConflictingTags*
    - En57::Benchmark::ConcurrentAppendConflictingTags*
    - En57::Benchmark::ConcurrentAppendNoFailIf*
    - En57::Benchmark::ConcurrentAppendNonConflictingTags*
    - En57::Benchmark::ConcurrentAppendNonConflictingTagsSeeded*
    - En57::Benchmark::Scenario#concurrently # thread raise mutation survives despite direct coverage
